# Run Chameleon Warp locally:
#
#   docker compose up -d --build
#   open http://localhost:8000
#
# Settings are optional — copy .env.example to .env to change them.
services:
  chameleon-warp:
    build:
      context: .
      args:
        # 0 = smaller image without Blender (no FBX import/export).
        WITH_BLENDER: ${WITH_BLENDER:-1}
    image: chameleon-warp:local
    restart: unless-stopped
    ports:
      # Bound to localhost only. Use "8000:8000" to reach it from your LAN
      # (there is no authentication — only do that on a network you trust).
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - chameleon-data:/data

volumes:
  chameleon-data:
