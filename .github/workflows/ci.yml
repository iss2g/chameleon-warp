name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install dependencies (pypardiso/MKL skipped — SuperLU fallback)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip wheel
          grep -viE '^\s*pypardiso' requirements.txt > /tmp/req-core.txt
          pip install -r /tmp/req-core.txt
      - name: Smoke tests
        env:
          PYTHON: python
        run: ./scripts/test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check + build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image (without Blender, to keep CI fast)
        run: docker build --build-arg WITH_BLENDER=0 -t chameleon-warp:ci .
      - name: Container serves the UI and the API
        run: |
          docker run -d --name cw -p 8000:8000 chameleon-warp:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS -X POST http://127.0.0.1:8000/api/sessions | grep -q session_id
      - name: Container logs
        if: always()
        run: docker logs cw || true
